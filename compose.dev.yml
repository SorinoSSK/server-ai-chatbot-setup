services:
  telegram-gateway:
    image: "${CHATBOT_TELEGRAM_GATEWAY_DEV_IMAGE_NAME}"
    container_name: "${CHATBOT_TELEGRAM_GATEWAY_DEV_CONTAINER_NAME}"
    environment:
      TZ: "Asia/Singapore"
      TELEGRAM_BOT_TOKEN: "${CHATBOT_TELEGRAM_BOT_TOKEN}"
      TELEGRAM_ALLOWED_CHAT_IDS: "${CHATBOT_TELEGRAM_ALLOWED_CHAT_IDS}"
      SESSION_RESET_ALLOWED_CHAT_IDS: "${CHATBOT_SESSION_RESET_ALLOWED_CHAT_IDS}"
      TELEGRAM_BOT_NAME: "${CHATBOT_NAME}"
      Q_USER: "${CHATBOT_RABBITMQ_USERNAME}"
      Q_PASSWORD: "${CHATBOT_RABBITMQ_PASSWORD}"
      REDIS_USERNAME: "${CHATBOT_REDIS_USERNAME}"
      REDIS_PASSWORD: "${CHATBOT_REDIS_PASSWORD}"
    # ports:
    #   - "${CHATBOT_TELEGRAM_GATEWAY_DEV_PORT}:${CHATBOT_TELEGRAM_GATEWAY_DEV_PORT}"
    volumes:
      - "${DEV_PATH}/${CHATBOT_TELEGRAM_GATEWAY_PATH_NAME}/telegram_gateway_application:/telegram_gateway/telegram_gateway_application"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - "chatbot-app-network"
    restart: unless-stopped

  bot-sanctuary:
    image: "${CHATBOT_BOT_SANCTUARY_DEV_IMAGE_NAME}"
    container_name: "${CHATBOT_BOT_SANCTUARY_DEV_CONTAINER_NAME}"
    environment:
      TZ: "Asia/Singapore"
      Q_USER: "${CHATBOT_RABBITMQ_USERNAME}"
      Q_PASSWORD: "${CHATBOT_RABBITMQ_PASSWORD}"
      LLM_CHAT_TYPE: "${CHATBOT_LLM_CHAT_TYPE}"
      LLM_ARCHITECT_TYPE: "${CHATBOT_LLM_ARCHITECT_TYPE}"
      LLM_CODER_TYPE: "${CHATBOT_LLM_CODER_TYPE}"
      LLM_REVIEW_TYPE: "${CHATBOT_LLM_REVIEW_TYPE}"
      LLM_DOCUMENTATION_TYPE: "${CHATBOT_LLM_DOCUMENTATION_TYPE}"
      LLM_CLAUDE_ACCESS_TYPE: "${CHATBOT_LLM_CLAUDE_ACCESS_TYPE}"
      LLM_CLAUDE_TOKEN: "${CHATBOT_LLM_CLAUDE_TOKEN}"
      LLM_CODEX_ACCESS_TYPE: "${CHATBOT_LLM_CODEX_ACCESS_TYPE}"
      LLM_CODEX_TOKEN: "${CHATBOT_LLM_CODEX_TOKEN}"
      LLM_DEEPSEEK_ACCESS_TYPE: "${CHATBOT_LLM_DEEPSEEK_ACCESS_TYPE}"
      LLM_DEEPSEEK_TOKEN: "${CHATBOT_LLM_DEEPSEEK_TOKEN}"
      LLM_QWEN_ACCESS_TYPE: "${CHATBOT_LLM_QWEN_ACCESS_TYPE}"
      LLM_QWEN_TOKEN: "${CHATBOT_LLM_QWEN_TOKEN}"
      TELEGRAM_BOT_NAME: "${CHATBOT_NAME}"
      SMTP_ENABLE_MAILER: "${CHATBOT_SMTP_ENABLE_MAILER}"
      SMTP_FORCE_SSL: "${CHATBOT_SMTP_FORCE_SSL}"
      SMTP_AUTH_TYPE: "${CHATBOT_SMTP_AUTH_TYPE}"
      SMTP_SKIP_TLS: "${CHATBOT_SMTP_SKIP_TLS}"
      SMTP_HOST: "${CHATBOT_SMTP_HOST}"
      SMTP_PORT: "${CHATBOT_SMTP_PORT}"
      SMTP_FROM_EMAIL: "${CHATBOT_SMTP_FROM_EMAIL}"
      SMTP_TO_EMAIL: "${CHATBOT_SMTP_TO_EMAIL}"
      SMTP_USERNAME: "${CHATBOT_SMTP_USERNAME}"
      SMTP_PASSWORD: "${CHATBOT_SMTP_PASSWORD}"
      REDIS_USERNAME: "${CHATBOT_BOT_SANCTUARY_REDIS_USERNAME}"
      REDIS_PASSWORD: "${CHATBOT_BOT_SANCTUARY_REDIS_PASSWORD}"
    volumes:
      - "${DEV_PATH}/${CHATBOT_BOT_SANCTUARY_PATH_NAME}/bot_sanctuary_application:/bot_sanctuary/bot_sanctuary_application"
      - "${DEV_PATH}/${CHATBOT_BOT_SANCTUARY_PATH_NAME}/bot_directory/claude:/home/bot_sanctuary_usr/.claude"
      - "${DEV_PATH}/${CHATBOT_BOT_SANCTUARY_PATH_NAME}/bot_directory/codex:/home/bot_sanctuary_usr/.codex"
      - "${DEV_PATH}/${CHATBOT_BOT_SANCTUARY_PATH_NAME}/bot_directory/qwen:/home/bot_sanctuary_usr/.qwen"
      - "${DEV_PATH}/${CHATBOT_BOT_SANCTUARY_PATH_NAME}/bot_directory/deepseek:/home/bot_sanctuary_usr/.deepseek"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - "chatbot-app-network"
    restart: unless-stopped

  rabbitmq:
    image: "rabbitmq:4.3.5-management"
    container_name: "${CHATBOT_RABBITMQ_CONTAINER_NAME}"
    environment:
      RABBITMQ_DEFAULT_USER: "${CHATBOT_RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${CHATBOT_RABBITMQ_PASSWORD}"
      RABBITMQ_DEFAULT_VHOST: "${CHATBOT_RABBITMQ_VHOST}"
    # ports:
    #   - "40000:5672"
    #   - "40002:15672"
    networks:
      - "chatbot-app-network"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    restart: unless-stopped

  redis:
    image: "redis:7.4-alpine"
    container_name: "${CHATBOT_REDIS_CONTAINER_NAME}"
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "always",
        "--requirepass", "${CHATBOT_REDIS_PASSWORD}",
        "--user", "${CHATBOT_REDIS_USERNAME}", "on", ">${CHATBOT_REDIS_PASSWORD}", "~*", "&*", "+@all",
        "--user", "${CHATBOT_BOT_SANCTUARY_REDIS_USERNAME}", "on", ">${CHATBOT_BOT_SANCTUARY_REDIS_PASSWORD}", "~bot_sanctuary:*", "&*", "+@all"
      ]
    # ports:
    #   - "${CHATBOT_REDIS_PORT}:6379"
    volumes:
      - "redis_data:/data"
    networks:
      - "chatbot-app-network"
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${CHATBOT_REDIS_USERNAME}", "-a", "${CHATBOT_REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${CHATBOT_REDIS_DATA_PATH}"

networks:
  chatbot-app-network:
    name: "chatbot-app-network"
